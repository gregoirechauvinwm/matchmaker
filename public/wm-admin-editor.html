<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Back office — Editor</title>
  <link rel="stylesheet" href="/wm-admin.css" />
</head>
<body>
  <div class="bo editor-bo">
    <!-- far-left icon rail -->
    <nav class="rail">
      <a class="rail-item" href="/wm-admin" title="Users">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>users</span>
      </a>
      <a class="rail-item active" href="/wm-admin/prompts" title="Prompts">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>prompts</span>
      </a>
      <a class="rail-item" href="/wm-admin/analytics" title="Analytics">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
        <span>analytics</span>
      </a>
      <form method="POST" action="/wm-admin/logout" class="rail-logout">
        <button title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </form>
    </nav>

    <!-- element menu: every prompt, task, part listed individually -->
    <aside class="elem-menu">
      <div class="menu-group">
        <div class="menu-head"><span>scripted lines</span></div>
        <ul class="menu-list">
          <li class="menu-item" id="menu-flowopener" data-kind="scripted" data-key="flow_opener">First message</li>
          <li class="menu-item" id="menu-paymentprompt" data-kind="scripted" data-key="payment_prompt">Payment prompt</li>
          <li class="menu-item" id="menu-paymentsuccess" data-kind="scripted" data-key="payment_success">Payment success</li>
          <li class="menu-item" id="menu-rateprompt" data-kind="scripted" data-key="rate_prompt">Rate prompt</li>
          <li class="menu-item" id="menu-ratesuccess" data-kind="scripted" data-key="rate_success">Rate success</li>
          <li class="menu-item" id="menu-rsvpprompt" data-kind="scripted" data-key="rsvp_prompt">RSVP prompt</li>
          <li class="menu-item" id="menu-rsvpsuccess" data-kind="scripted" data-key="rsvp_success">RSVP success</li>
        </ul>
      </div>
      <div class="menu-group">
        <div class="menu-head"><span>prompts</span></div>
        <ul id="menu-prompts" class="menu-list"></ul>
      </div>
      <div class="menu-group">
        <div class="menu-head"><span>tasks</span><button id="new-task" class="menu-add">+ create new</button></div>
        <ul id="menu-tasks" class="menu-list"></ul>
      </div>
      <div class="menu-group">
        <div class="menu-head"><span>parts</span><button id="new-part" class="menu-add">+ create new</button></div>
        <ul id="menu-parts" class="menu-list"></ul>
      </div>
    </aside>

    <!-- main editing area -->
    <main class="editor-main">
      <div class="editor-topbar">
        <span id="dirty-note" class="dirty-note"></span>
        <button id="history-btn" class="link">View version history</button>
        <button id="copyall-btn" class="link">Copy all prompts</button>
        <button id="pasteall-btn" class="link">Paste prompts</button>
        <button id="cancel-btn" class="btn-ghost-sm">Cancel</button>
        <button id="save-btn" class="btn-primary-sm">Save &amp; publish</button>
      </div>
      <div id="editor-content" class="editor-area"></div>
    </main>
  </div>
  <script src="/wm-admin-editor.js"></script>
</body>
</html>
