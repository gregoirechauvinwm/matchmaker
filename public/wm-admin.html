<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Back office</title>
  <link rel="stylesheet" href="/wm-admin.css" />
</head>
<body>
  <div class="bo">
    <!-- far-left icon rail -->
    <nav class="rail">
      <a class="rail-item active" href="/wm-admin" title="Users">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>users</span>
      </a>
      <a class="rail-item" href="/wm-admin/prompts" title="Prompts">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>prompts</span>
      </a>
      <form method="POST" action="/wm-admin/logout" class="rail-logout">
        <button title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </form>
    </nav>

    <!-- users column -->
    <aside class="users-col">
      <div class="col-head">Users</div>
      <ul id="users-list" class="users-list"></ul>
    </aside>

    <!-- conversation column -->
    <main class="convo-col">
      <div id="convo-head" class="col-head"></div>
      <div id="convo" class="convo"></div>
    </main>

    <!-- completion detail column -->
    <aside class="comp-col">
      <div class="col-head">Completion</div>
      <div id="comp" class="comp-empty">Select "see completion" on any result.</div>
    </aside>
  </div>
  <script src="/wm-admin.js"></script>
</body>
</html>
